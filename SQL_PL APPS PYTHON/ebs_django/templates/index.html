/* ============ EBS LIVE CONNECTOR (Multi-Session + Pagination) ============ */
async function renderEbsLive(v) {
  // Users cannot access
  if (state.user.role === 'USER') {
    v.innerHTML = `
      <div class="page-title"><i class="fas fa-server"></i> EBS Live Connector</div>
      <div class="empty">
        <i class="fas fa-lock" style="color:var(--warning)"></i>
        <p style="margin-top:.5rem">EBS Live access requires <strong>Consultant</strong> or <strong>Admin</strong> role.</p>
      </div>
    `;
    return;
  }

  v.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading EBS connector…</div>';

  // Refresh sessions + servers
  await checkEbsSessions();

  let servers = [];
  try { servers = await api('/db-servers/'); } catch (e) {}
  servers = servers.filter(s => s.server_type === 'EBS' && s.is_active);

  const sessionCount = state.ebsSessions.length;
  const maxSessions = 5;

  // No servers
  if (!servers.length) {
    v.innerHTML = `
      <div class="page-title"><i class="fas fa-server"></i> EBS Live Connector</div>
      <div class="page-sub">Query your Oracle EBS database directly.</div>
      <div class="empty">
        <i class="fas fa-exclamation-triangle" style="color:var(--warning)"></i>
        <p style="margin-top:.5rem">No EBS servers configured yet.</p>
        <p class="text-xs text-muted" style="margin-top:.35rem">${state.user.role === 'ADMIN' ? 'Add one in Settings → Connections.' : 'Ask an admin to add one.'}</p>
      </div>
    `;
    return;
  }

  v.innerHTML = `
    <div class="page-title"><i class="fas fa-server"></i> EBS Live Connector</div>
    <div class="page-sub">
      Multi-session supported (${sessionCount}/${maxSessions} active). Credentials are stored in memory only.
    </div>

    <div class="announce" style="background:linear-gradient(135deg,var(--accent-soft),var(--success-soft))">
      <i class="fas fa-shield-alt" style="color:var(--success)"></i>
      <div class="announce-content">
        <strong>Security Notice:</strong> Your DB credentials are never saved to disk. They exist only in server memory and auto-expire after 20 minutes of inactivity. Each browser session requires re-authentication.
      </div>
    </div>

    <!-- Active Sessions List -->
    ${sessionCount > 0 ? `
      <div class="panel">
        <div class="panel-title"><i class="fas fa-plug" style="color:var(--success)"></i> Active Sessions (${sessionCount})</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.75rem;margin-top:.5rem">
          ${state.ebsSessions.map(s => `
            <div class="ds-card" style="padding:1rem;border-left:4px solid ${state.activeEbsSessionKey === s.session_key ? 'var(--accent)' : 'var(--success)'}">
              <div class="ds-head">
                <div class="ds-name" style="font-size:.9rem">${esc(s.server_name)}</div>
                <span class="chip success"><i class="fas fa-check"></i> Active</span>
              </div>
              <div class="ds-meta">
                <span><i class="fas fa-user"></i> ${esc(s.username)}</span>
                <span><i class="fas fa-clock"></i> ${fmtRelative(new Date(s.connected_at * 1000).toISOString())}</span>
              </div>
              <div style="display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap">
                <button class="btn ${state.activeEbsSessionKey === s.session_key ? 'btn-primary' : 'btn-outline'} btn-sm setActiveSessBtn" data-key="${esc(s.session_key)}">
                  <i class="fas fa-check-circle"></i> ${state.activeEbsSessionKey === s.session_key ? 'Active' : 'Set Active'}
                </button>
                <button class="btn btn-ghost btn-sm openSessEditorBtn" data-key="${esc(s.session_key)}" title="Open editor for this session">
                  <i class="fas fa-terminal"></i>
                </button>
                <button class="btn btn-ghost btn-sm closeSessBtn" data-key="${esc(s.session_key)}" title="Disconnect">
                  <i class="fas fa-times" style="color:var(--danger)"></i>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    <!-- New Connection -->
    <div class="panel">
      <div class="panel-title"><i class="fas fa-plus-circle"></i> New Connection</div>
      ${sessionCount >= maxSessions ? `
        <p class="text-xs" style="color:var(--warning)">
          <i class="fas fa-exclamation-triangle"></i> Maximum ${maxSessions} sessions reached. Close one first.
        </p>
      ` : `
        <p class="text-xs text-muted mb-4">
          Enter your Oracle DB credentials. They are sent over HTTPS and held in server memory only.
        </p>
        <div class="field">
          <label>EBS Server *</label>
          <select id="ebsServerSelect">
            ${servers.map(s => `
              <option value="${s.id}">${esc(s.name)} — ${esc(s.host)}:${s.port}/${esc(s.service_name || s.sid || '')}</option>
            `).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>DB Username *</label>
            <input id="ebsUser" placeholder="e.g. APPS" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label>DB Password *</label>
            <input id="ebsPass" type="password" placeholder="••••••••" autocomplete="off">
          </div>
        </div>
        <div class="field">
          <label>Session Name (optional)</label>
          <input id="ebsSessionName" placeholder="e.g. Prod Investigation">
        </div>
        <button class="btn btn-primary" id="ebsConnectBtn">
          <i class="fas fa-plug"></i> Connect & Test
        </button>
        <div class="text-xs text-muted" style="margin-top:.75rem">
          <i class="fas fa-lock"></i> Credentials are never stored. Auto-cleared on logout or after 20 min idle.
        </div>
      `}
    </div>

    <!-- Editor (only if a session is active) -->
    ${state.activeEbsSessionKey ? `
      <div class="editor-wrap">
        <div class="editor-toolbar">
          <div class="group">
            <button class="btn btn-primary btn-sm" id="ebsRunBtn">
              <i class="fas fa-play"></i> Run on EBS
            </button>
            <button class="btn btn-outline btn-sm" id="ebsFmtBtn" style="background:rgba(127,127,127,.15);color:var(--ed-fg);border-color:transparent">
              <i class="fas fa-align-left"></i> Format
            </button>
            <button class="btn btn-outline btn-sm" id="ebsClearBtn" style="background:rgba(127,127,127,.15);color:var(--ed-fg);border-color:transparent">
              <i class="fas fa-eraser"></i> Clear
            </button>
            <button class="btn btn-outline btn-sm" id="ebsCopyBtn" style="background:rgba(127,127,127,.15);color:var(--ed-fg);border-color:transparent">
              <i class="fas fa-copy"></i> Copy
            </button>
          </div>
          <div class="hint">
            <kbd>Ctrl</kbd> + <kbd>Enter</kbd> · SELECT only
          </div>
        </div>
        <div class="editor-body">
          <div class="ln" id="ebsLn">1</div>
          <textarea id="ebsEditor" class="sql-editor" spellcheck="false" placeholder="SELECT * FROM FND_USER WHERE ROWNUM <= 100"></textarea>
        </div>
      </div>

      <div class="panel" style="padding:0;overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;
          border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap;gap:.5rem">
          <span style="font-weight:600;font-size:.9rem"><i class="fas fa-table"></i> EBS Results</span>
          <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
            <span class="chip" id="ebsRowCount">0 rows</span>
            <span class="chip" id="ebsDuration" style="display:none"></span>
            <button class="btn btn-outline btn-sm" id="ebsExportCsvBtn" disabled><i class="fas fa-file-csv"></i> CSV</button>
            <button class="btn btn-outline btn-sm" id="ebsExportJsonBtn" disabled><i class="fas fa-file-code"></i> JSON</button>
            <button class="btn btn-outline btn-sm" id="ebsSaveAsDsBtn" disabled title="Save result as a new Dataset">
              <i class="fas fa-save"></i> Save as Dataset
            </button>
          </div>
        </div>
        <div class="tbl-wrap" style="border:0;border-radius:0">
          <div class="tbl-scroll" id="ebsGridWrap">
            <div class="empty"><i class="fas fa-terminal"></i>Write a SELECT query and click <strong>Run on EBS</strong></div>
          </div>
          <div id="ebsPagination"></div>
        </div>
      </div>
    ` : `
      <div class="panel" style="text-align:center;color:var(--text-3);padding:2.5rem">
        <i class="fas fa-plug" style="font-size:2rem;display:block;margin-bottom:.5rem;opacity:.5"></i>
        Connect to an EBS server to enable the editor
      </div>
    `}
  `;

  // ===== Connect button =====
  const connectBtn = $('#ebsConnectBtn');
  if (connectBtn) {
    connectBtn.addEventListener('click', async () => {
      const serverId = parseInt($('#ebsServerSelect').value);
      const dbUser = $('#ebsUser').value.trim();
      const dbPass = $('#ebsPass').value;
      const sessionName = $('#ebsSessionName').value.trim();

      if (!serverId || !dbUser || !dbPass) {
        return toast('All fields are required', 'error');
      }

      connectBtn.disabled = true;
      connectBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting…';

      try {
        const r = await api('/ebs/connect/', {
          method: 'POST',
          body: JSON.stringify({
            server_id: serverId,
            db_username: dbUser,
            db_password: dbPass,
            session_name: sessionName,
          })
        });
        toast(`Connected to ${r.server.name}`, 'success');
        state.activeEbsSessionKey = r.session_key;
        await checkEbsSessions();
        setTimeout(() => renderEbsLive(v), 300);
      } catch (err) {
        toast(err.message, 'error');
        connectBtn.disabled = false;
        connectBtn.innerHTML = '<i class="fas fa-plug"></i> Connect & Test';
      }
    });
  }

  // ===== Set active session =====
  $$('.setActiveSessBtn').forEach(b => b.addEventListener('click', () => {
    state.activeEbsSessionKey = b.dataset.key;
    renderEbsLive(v);
  }));

  // ===== Open session editor =====
  $$('.openSessEditorBtn').forEach(b => b.addEventListener('click', () => {
    state.activeEbsSessionKey = b.dataset.key;
    renderEbsLive(v);
  }));

  // ===== Close session =====
  $$('.closeSessBtn').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Disconnect this session?')) return;
    try {
      await api('/ebs/disconnect/', {
        method: 'POST',
        body: JSON.stringify({ session_key: b.dataset.key })
      });
      toast('Disconnected', 'success');
      if (state.activeEbsSessionKey === b.dataset.key) {
        state.activeEbsSessionKey = null;
      }
      await checkEbsSessions();
      renderEbsLive(v);
    } catch (err) { toast(err.message, 'error'); }
  }));

  // ===== Editor =====
  const editor = $('#ebsEditor');
  const ln = $('#ebsLn');

  if (editor) {
    function paintLn() {
      const n = editor.value.split('\n').length;
      ln.innerHTML = Array.from({ length: n }, (_, i) => i + 1).join('<br>');
    }
    paintLn();
    editor.addEventListener('input', paintLn);
    editor.addEventListener('scroll', () => { ln.scrollTop = editor.scrollTop; });

    // Autosave EBS editor SQL per session
    const autosave = debounce(() => {
      try {
        localStorage.setItem('ebs_sql_' + state.activeEbsSessionKey, editor.value);
      } catch (e) {}
    }, 2000);
    editor.addEventListener('input', autosave);

    // Restore last SQL for this session
    try {
      const saved = localStorage.getItem('ebs_sql_' + state.activeEbsSessionKey);
      if (saved) { editor.value = saved; paintLn(); }
    } catch (e) {}

    // ===== Run =====
    const runBtn = $('#ebsRunBtn');
    runBtn.addEventListener('click', async () => {
      const sql = editor.value.trim();
      if (!sql) return toast('Write a query first', 'warn');

      runBtn.disabled = true;
      runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running…';

      try {
        const r = await api('/ebs/query/', {
          method: 'POST',
          body: JSON.stringify({
            sql,
            session_key: state.activeEbsSessionKey
          })
        });
        state.ebsLastResult = r.rows;
        state.ebsPagination.allRows = r.rows;
        state.ebsPagination.page = 1;
        state.ebsPagination.total = r.rows.length;

        paintEbsGrid(r);
        $('#ebsRowCount').textContent = `${fmtNum(r.row_count)} rows`;
        $('#ebsDuration').style.display = '';
        $('#ebsDuration').textContent = `${r.duration_ms} ms`;
        ['ebsExportCsvBtn', 'ebsExportJsonBtn', 'ebsSaveAsDsBtn'].forEach(id => {
          const el = $('#' + id);
          if (el) el.disabled = !r.rows.length;
        });
        if (r.truncated) toast('Result truncated to 50,000 rows', 'warn');
        toast(`Returned ${fmtNum(r.row_count)} row(s) in ${r.duration_ms}ms`, 'success');

        // Refresh notifications (query may have triggered admin notify on failure)
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        runBtn.disabled = false;
        runBtn.innerHTML = '<i class="fas fa-play"></i> Run on EBS';
      }
    });

    // Ctrl+Enter
    editor.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runBtn.click();
      }
    });

    // Format
    $('#ebsFmtBtn').addEventListener('click', () => {
      let s = editor.value;
      s = s.replace(/\s+/g, ' ')
           .replace(/\s*,\s*/g, ',\n  ')
           .replace(/\s+FROM\s+/gi, '\nFROM ')
           .replace(/\s+WHERE\s+/gi, '\nWHERE ')
           .replace(/\s+ORDER BY\s+/gi, '\nORDER BY ')
           .replace(/\s+GROUP BY\s+/gi, '\nGROUP BY ')
           .replace(/\s+JOIN\s+/gi, '\nJOIN ')
           .replace(/\s+ON\s+/gi, '\n  ON ');
      editor.value = s;
      paintLn();
    });

    // Clear
    $('#ebsClearBtn').addEventListener('click', () => {
      editor.value = '';
      paintLn();
      $('#ebsGridWrap').innerHTML = '<div class="empty"><i class="fas fa-terminal"></i>Editor cleared</div>';
      $('#ebsRowCount').textContent = '0 rows';
      $('#ebsDuration').style.display = 'none';
      $('#ebsPagination').innerHTML = '';
    });

    // Copy
    $('#ebsCopyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(editor.value);
      toast('Copied', 'success');
    });

    // Export CSV
    $('#ebsExportCsvBtn').addEventListener('click', () => {
      const rows = state.ebsLastResult || [];
      if (!rows.length) return;
      const cols = Object.keys(rows[0]);
      const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => {
        let v = r[c] ?? '';
        if (typeof v === 'string' && /[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
        return v;
      }).join(','))).join('\n');
      download(`ebs_result_${Date.now()}.csv`, csv, 'text/csv');
    });

    // Export JSON
    $('#ebsExportJsonBtn').addEventListener('click', () => {
      const rows = state.ebsLastResult || [];
      if (!rows.length) return;
      download(`ebs_result_${Date.now()}.json`, JSON.stringify(rows, null, 2), 'application/json');
    });

    // Save as Dataset
    $('#ebsSaveAsDsBtn').addEventListener('click', () => openSaveEbsAsDatasetModal());
  }
}

function paintEbsGrid(result) {
  const el = $('#ebsGridWrap');
  const rows = result.rows || [];
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>No rows returned</div>';
    $('#ebsPagination').innerHTML = '';
    return;
  }

  const PER_PAGE = 50;
  let currentPage = 1;

  function renderPage() {
    const start = (currentPage - 1) * PER_PAGE;
    const end = start + PER_PAGE;
    const pageRows = rows.slice(start, end);
    const cols = result.columns && result.columns.length ? result.columns : Object.keys(rows[0]);

    let html = '<table><thead><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
    pageRows.forEach(r => {
      html += '<tr>' + cols.map(c => {
        let v = r[c];
        if (v === null || v === undefined) v = '<span style="color:var(--text-3)">NULL</span>';
        else if (typeof v === 'object') v = esc(JSON.stringify(v));
        else v = esc(String(v));
        return `<td>${v}</td>`;
      }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;

    renderPagination('ebsPagination', rows.length, currentPage, PER_PAGE, (p) => {
      currentPage = p;
      renderPage();
      el.scrollTo(0, 0);
    });
  }
  renderPage();
}

            <input id="saveDsTags" placeholder="e.g. ebs, snapshot">
          </div>
          <div class="field">
            <label>Privacy</label>
            <select id="saveDsPrivate">
              <option value="true">Private</option>
              <option value="false">Public</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline btn-sm" id="saveDsCancel">Cancel</button>
          <button class="btn btn-primary btn-sm" id="saveDsConfirm">
            <i class="fas fa-save"></i> Save
          </button>
        </div>
      </div>
    </div>
  `;
  const close = () => $('#modalRoot').innerHTML = '';
  $('#saveDsCancel').addEventListener('click', close);
  $('#mBg').addEventListener('click', e => { if (e.target.id === 'mBg') close(); });

  $('#saveDsConfirm').addEventListener('click', async () => {
    const name = $('#saveDsName').value.trim();
    if (!name) return toast('Name required', 'error');

    const fd = new FormData();
    const blob = new Blob([JSON.stringify(rows)], { type: 'application/json' });
    fd.append('file', blob, `${name}.json`);
    fd.append('name', name);
    fd.append('description', $('#saveDsDesc').value.trim());
    fd.append('tags', $('#saveDsTags').value.trim());
    fd.append('private', $('#saveDsPrivate').value === 'true' ? 'true' : 'false');

    try {
      const r = await api('/datasets/upload/', { method: 'POST', body: fd });
      toast(`Saved: ${r.name} (${r.row_count} rows)`, 'success');
      close();
    } catch (err) { toast(err.message, 'error'); }
  });
}

  try {

    if (badge) badge.textContent = reqs.length ? `(${reqs.length})` : '';

      c.innerHTML = '<div class="panel" style="text-align:center;color:var(--text-3);padding:2.5rem"><i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:.5rem;opacity:.5"></i>No pending access requests.</div>';
      return;
    }
    c.innerHTML = `
      <div class="panel">
        <div class="panel-title"><i class="fas fa-key"></i> Pending Access Requests</div>
        ${reqs.map(r => `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.75rem 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
            <div>
              <div><strong>${esc(r.requested_by)}</strong> → <strong>${esc(r.dataset_name)}</strong></div>
              <div class="text-xs text-muted">Owner: ${esc(r.dataset_owner)} · ${fmtDate(r.created_at)}</div>
            </div>
            <div style="display:flex;gap:.4rem">
              <button class="btn btn-success btn-sm approveBtn" data-id="${r.id}"><i class="fas fa-check"></i> Approve</button>

            </div>
          </div>`).join('')}
      </div>
    `;
    $$('.approveBtn').forEach(b => b.addEventListener('click', () => resolveReq(b.dataset.id, 'approved', c)));
    $$('.rejectBtn').forEach(b => b.addEventListener('click', () => resolveReq(b.dataset.id, 'rejected', c)));
  } catch (err) { toast(err.message, 'error'); }

async function resolveReq(id, status, container) {
  try {
    await api(`/access-requests/${id}/resolve/`, { method: 'PUT', body: JSON.stringify({ status }) });
    toast(`Request ${status}`, 'success');
    renderRequestsTab(container);
    loadNotifications();
  } catch (err) { toast(err.message, 'error'); }
}

    try {

        await api(`/db-servers/${server.id}/update/`, { method: 'PUT', body: JSON.stringify(body) });

        await api('/db-servers/create/', { method: 'POST', body: JSON.stringify(body) });

      toast(`Server ${isEdit ? 'updated' : 'created'}`, 'success');
      close();
    } catch (err) { toast(err.message, 'error'); }
  });

          <table>

                    <button class="btn btn-ghost btn-xs delTTBtn" data-id="${t.id}" data-name="${esc(t.table_name)}"><i class="fas fa-trash" style="color:var(--danger)"></i></button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    ` : ''}
    ${auto.length ? `
      <h3 style="font-size:1rem;font-weight:600;margin-top:1.5rem;display:flex;align-items:center;gap:.5rem">
        <i class="fas fa-chart-bar" style="color:var(--purple)"></i> Auto-detected (Most Searched)
      </h3>
      <div class="tbl-wrap" style="margin-top:.75rem">
        <div class="tbl-scroll">
          <table>
            <thead><tr><th>Table</th><th>Search Hits</th><th>Action</th></tr></thead>

    try {
      await api('/top-tables/create/', { method: 'POST', body: JSON.stringify(body) });
      toast('Added', 'success');
      renderTopTablesTab(c);
    } catch (err) { toast(err.message, 'error'); }
  });
  $$('.editTTBtn').forEach(b => b.addEventListener('click', async () => {

    const newName = prompt('Table name:', t.table_name);
    if (!newName) return;
    const newDesc = prompt('Description:', t.description || '') ?? '';
    const newRank = prompt('Rank:', t.rank) ?? t.rank;

        method: 'PUT',
        body: JSON.stringify({ table_name: newName, description: newDesc, rank: parseInt(newRank) || 0 })

  $$('.adoptBtn').forEach(b => b.addEventListener('click', async () => {
    try {
      await api('/top-tables/create/', {
        method: 'POST',
        body: JSON.stringify({
          table_name: b.dataset.name,
          description: 'Auto-detected',
          rank: parseInt(b.dataset.rank) || 0
        })
      });
      toast('Adopted', 'success');
      renderTopTablesTab(c);
    } catch (err) { toast(err.message, 'error'); }
  }));
}

    $$('.bulkCheck').forEach(c => c.checked = e.target.checked);

      await api('/datasets/bulk-delete/', { method: 'POST', body: JSON.stringify({ mode: 'all' }) });
      toast('All moved to trash', 'success');

      await api('/datasets/bulk-delete/', { method: 'POST', body: JSON.stringify({ mode: 'selected', ids }) });
      toast(`${ids.length} moved`, 'success');
      renderBulkTab(c);
    } catch (err) { toast(err.message, 'error'); }
  });
}

/* ---- Backup ---- */
async function renderBackupTab(c) {
  c.innerHTML = `
    <div class="panel">
      <div class="panel-title"><i class="fas fa-database"></i> Backup & Restore</div>
      <p class="text-xs text-muted mb-4">Export the entire SQLite DB. Import replaces current DB (safety backup kept).</p>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="backupExportBtn"><i class="fas fa-download"></i> Download Backup (.db)</button>
        <label class="btn btn-outline btn-sm" style="cursor:pointer">
          <i class="fas fa-upload"></i> Restore from Backup
          <input type="file" id="backupImportFile" accept=".db" style="display:none">
        </label>
      </div>
    </div>
  `;
  $('#backupExportBtn').addEventListener('click', async () => {
    try {
      const res = await fetch('/api/backup/export/', {
        headers: { 'Authorization': 'Bearer ' + state.token }
      });
      if (!res.ok) throw new Error('Export failed');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ebs_backup_${Date.now()}.db`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Backup downloaded', 'success');
    } catch (err) { toast(err.message, 'error'); }
  });
  $('#backupImportFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!confirm('This will REPLACE the entire database. Continue?')) return;
    const fd = new FormData();
    fd.append('file', f);
    try {
      await api('/backup/import/', { method: 'POST', body: fd });
      toast('Restored. Please re-login.', 'success');
      setTimeout(() => logout(), 1500);
    } catch (err) { toast(err.message, 'error'); }
  });
}

/* ============ BOOT ============ */
document.addEventListener('DOMContentLoaded', async () => {
  await loadPublicSettings();

  // Notif button
  $('#notifBtn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleNotifPanel();
  });

  // EBS chip
  $('#ebsChip')?.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleSessionPanel();
  });

  // Setup / Login buttons
  $('#setupBtn')?.addEventListener('click', doSetup);
  $('#loginBtn')?.addEventListener('click', doLogin);
  $('#loginPass')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#loginUser')?.addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginPass').focus(); });

  // Logout
  $('#logoutBtn')?.addEventListener('click', logout);
  $('#brandBtn')?.addEventListener('click', () => navigate('hub'));

  // Clear EBS session when browser closes
  window.addEventListener('beforeunload', () => {
    if (state.user && state.token) {
      try {
        const data = new Blob([JSON.stringify({})], { type: 'application/json' });
        navigator.sendBeacon('/api/ebs/disconnect/', data);
      } catch (e) {}
    }
  });

  // Check setup
  const setup = await checkSetup();
  if (!setup.setup_complete) {
    $('#setupScreen').classList.remove('hidden');
    return;
  }

  // Try restore session
  const ok = await restoreSession();
  if (!ok) {
    $('#loginScreen').classList.remove('hidden');
  }
});
</script>
