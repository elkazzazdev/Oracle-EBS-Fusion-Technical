<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBS R12 Explorer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ============ RESET & VARIABLES ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f8fc; --surface:#fff; --surface-2:#f1f5f9; --elevated:#fff;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#dbeafe;
  --success:#10b981; --success-soft:#d1fae5;
  --warning:#f59e0b; --warning-soft:#fef3c7;
  --danger:#ef4444; --danger-soft:#fee2e2;
  --purple:#8b5cf6; --purple-soft:#ede9fe;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,.08);
  --radius:14px; --radius-lg:20px; --radius-sm:10px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --transition:all .2s cubic-bezier(.4,0,.2,1);
  /* Editor theme (VS Dark default) */
  --ed-bg:#1e1e1e; --ed-fg:#d4d4d4; --ed-ln:#6a6a6a; --ed-tb:#252526;
  --ed-bd:#333; --ed-sel:#264f78;
}
body.dark{
  --bg:#0a0f1c; --surface:#111827; --surface-2:#1e293b; --elevated:#1a2233;
  --border:#1f2937; --border-strong:#334155;
  --text:#f1f5f9; --text-2:#cbd5e1; --text-3:#64748b;
  --accent:#3b82f6; --accent-hover:#60a5fa; --accent-soft:#1e3a5f;
  --success:#34d399; --success-soft:#064e3b;
  --warning:#fbbf24; --warning-soft:#78350f;
  --danger:#f87171; --danger-soft:#7f1d1d;
  --purple:#a78bfa; --purple-soft:#4c1d95;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
  --shadow-lg:0 10px 40px rgba(0,0,0,.4);
}
/* ===== Editor Themes ===== */
body.ed-theme-vs-dark  {--ed-bg:#1e1e1e;--ed-fg:#d4d4d4;--ed-ln:#6a6a6a;--ed-tb:#252526;--ed-bd:#333;--ed-sel:#264f78}
body.ed-theme-vs-light {--ed-bg:#ffffff;--ed-fg:#1e1e1e;--ed-ln:#adb5bd;--ed-tb:#f3f3f3;--ed-bd:#e0e0e0;--ed-sel:#add6ff}
body.ed-theme-monokai   {--ed-bg:#272822;--ed-fg:#f8f8f2;--ed-ln:#75715e;--ed-tb:#1e1f1c;--ed-bd:#3e3d32;--ed-sel:#49483e}
body.ed-theme-solarized {--ed-bg:#002b36;--ed-fg:#839496;--ed-ln:#586e75;--ed-tb:#073642;--ed-bd:#0a4551;--ed-sel:#073642}
body.ed-theme-github    {--ed-bg:#ffffff;--ed-fg:#24292e;--ed-ln:#959da5;--ed-tb:#f6f8fa;--ed-bd:#d1d5da;--ed-sel:#b6d6f6}

html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
  transition:background-color .3s,color .3s;-webkit-font-smoothing:antialiased;line-height:1.5}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:.7rem .9rem;color:var(--text);width:100%;font-size:.9rem;
  transition:var(--transition);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{font-family:var(--font);resize:vertical;min-height:80px}
label{font-size:.8rem;font-weight:500;color:var(--text-2);margin-bottom:.35rem;display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 1.1rem;
  border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;transition:var(--transition);
  white-space:nowrap;user-select:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.btn-outline:hover{background:var(--surface-2);border-color:var(--accent);color:var(--accent)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
.btn-xs{padding:.25rem .55rem;font-size:.72rem}
.btn-icon{padding:.55rem;border-radius:50%;width:2.4rem;height:2.4rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ============ TOPBAR ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.5rem;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
  backdrop-filter:blur(12px);flex-wrap:wrap}
.topbar-brand{display:flex;align-items:center;gap:.7rem;font-weight:700;font-size:1.05rem;
  cursor:pointer;user-select:none}
.topbar-brand i{color:var(--accent);font-size:1.4rem}
.topbar-brand .tagline{font-size:.75rem;color:var(--text-3);font-weight:400;margin-left:.4rem;display:none}
@media(min-width:900px){.topbar-brand .tagline{display:inline}}
.topbar-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.user-chip{display:flex;align-items:center;gap:.5rem;padding:.4rem .8rem;background:var(--accent-soft);
  border-radius:2rem;font-size:.8rem;font-weight:500;color:var(--accent)}
.user-chip .role{opacity:.75;font-size:.7rem}

/* ============ NOTIFICATION BELL ============ */
.notif-bell{position:relative;display:inline-flex}
.notif-bell .dot{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;
  border-radius:10px;min-width:18px;height:18px;font-size:.65rem;font-weight:600;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.notif-panel{position:absolute;top:100%;right:0;margin-top:.5rem;width:380px;max-width:90vw;
  max-height:500px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:200}
.notif-header{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.notif-header h3{font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.notif-item{padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;
  transition:var(--transition);display:flex;gap:.75rem}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:var(--accent-soft)}
.notif-icon{flex-shrink:0;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:.85rem}
.notif-icon.info{background:var(--accent-soft);color:var(--accent)}
.notif-icon.success{background:var(--success-soft);color:var(--success)}
.notif-icon.warning{background:var(--warning-soft);color:var(--warning)}
.notif-icon.danger{background:var(--danger-soft);color:var(--danger)}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:.82rem;font-weight:600;margin-bottom:.15rem;word-break:break-word}
.notif-msg{font-size:.75rem;color:var(--text-2);line-height:1.4;word-break:break-word}
.notif-time{font-size:.68rem;color:var(--text-3);margin-top:.35rem}

/* ============ EBS SESSION CHIP ============ */
.ebs-chip-wrapper{position:relative}
.ebs-chip{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .8rem;
  background:var(--success-soft);color:var(--success);border-radius:2rem;
  font-size:.8rem;font-weight:500;cursor:pointer;transition:var(--transition)}
.ebs-chip:hover{background:#a7f3d0}
.ebs-chip .count{background:var(--success);color:#fff;border-radius:50%;
  min-width:18px;height:18px;font-size:.65rem;display:flex;align-items:center;
  justify-content:center;font-weight:600}

.session-panel{position:absolute;top:100%;right:0;margin-top:.5rem;width:340px;
  max-width:90vw;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:200}
.session-item{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;gap:.5rem}
.session-item:last-child{border-bottom:none}
.session-info{flex:1;min-width:0}
.session-name{font-size:.85rem;font-weight:600;word-break:break-word}
.session-meta{font-size:.7rem;color:var(--text-3);margin-top:.15rem}

/* ============ MAIN TABS ============ */
.main-tabs{display:flex;gap:.25rem;padding:.5rem 1.5rem 0;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:57px;z-index:49}
.main-tab{padding:.7rem 1.1rem;font-size:.875rem;font-weight:500;color:var(--text-2);
  border-bottom:2px solid transparent;transition:var(--transition);white-space:nowrap;
  display:inline-flex;align-items:center;gap:.4rem}
.main-tab:hover{color:var(--text);background:var(--surface-2);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.main-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.main{padding:1.75rem 1.5rem;max-width:1600px;margin:0 auto;width:100%}
.page-title{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.35rem;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.page-title i{color:var(--accent)}
.page-sub{color:var(--text-2);font-size:.875rem;margin-bottom:1.25rem}

/* ============ LOGIN & SETUP ============ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;
  background:radial-gradient(1200px 600px at 50% -10%,var(--accent-soft),transparent 60%)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:2.5rem 2rem;width:100%;max-width:440px;box-shadow:var(--shadow-lg)}
.login-logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:1.2rem}
.login-card h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.login-card .sub{color:var(--text-3);font-size:.85rem;margin-bottom:1.8rem}
.field{margin-bottom:1rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.err{color:var(--danger);font-size:.8rem;margin-top:.75rem;min-height:1.2rem}

/* ============ HUB / CARDS ============ */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem;margin-top:1rem}
.hub-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:1.5rem;cursor:pointer;transition:var(--transition)}
.hub-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.hub-icon{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:.85rem}
.hub-card h3{font-size:1.05rem;font-weight:600;margin-bottom:.35rem}
.hub-card p{color:var(--text-2);font-size:.82rem}

.note-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:1rem}
.note-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:1.25rem;transition:var(--transition)}
.note-card.color-green{border-left-color:var(--success)}
.note-card.color-yellow{border-left-color:var(--warning)}
.note-card.color-red{border-left-color:var(--danger)}
.note-card.color-purple{border-left-color:var(--purple)}
.note-title{font-size:1rem;font-weight:600;margin-bottom:.4rem;display:flex;
  align-items:center;justify-content:space-between;gap:.5rem}
.note-content{color:var(--text-2);font-size:.85rem;white-space:pre-wrap;line-height:1.6}

.tt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin-top:1rem}
.tt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:.85rem 1rem;display:flex;align-items:center;gap:.6rem}
.tt-rank{width:28px;height:28px;background:var(--accent-soft);color:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.tt-name{font-weight:600;font-size:.85rem;word-break:break-all}

.announce{background:linear-gradient(135deg,var(--warning-soft),var(--accent-soft));
  border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.25rem;
  display:flex;gap:.75rem;align-items:flex-start}
.announce i{color:var(--warning);font-size:1.2rem;flex-shrink:0}
.announce-content{font-size:.875rem;color:var(--text);white-space:pre-wrap;line-height:1.5}

/* ============ STATS ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.stat-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600}
.stat-value{font-size:1.5rem;font-weight:700;margin-top:.25rem;letter-spacing:-.02em}
.stat-value.accent{color:var(--accent)}

/* ============ SEARCH / FILTERS ============ */
.search-bar{position:relative;margin-bottom:.75rem}
.search-bar i.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none}
.search-bar input{padding-left:2.7rem;padding-right:2.7rem;height:46px;font-size:.9rem;border-radius:var(--radius)}
.search-bar .clear{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
  padding:.4rem;border-radius:50%;color:var(--text-3);width:2rem;height:2rem;
  display:flex;align-items:center;justify-content:center}
.search-bar .clear:hover{background:var(--surface-2);color:var(--text)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;align-items:center}
.filter-chip{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .8rem;background:var(--surface);
  border:1px solid var(--border);border-radius:2rem;font-size:.78rem;color:var(--text-2);
  cursor:pointer;transition:var(--transition)}
.filter-chip:hover{border-color:var(--accent);color:var(--accent)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-select{padding:.4rem .8rem;background:var(--surface);border:1px solid var(--border);
  border-radius:2rem;font-size:.78rem;color:var(--text-2);cursor:pointer;width:auto}
.filter-select:focus{outline:none;border-color:var(--accent)}

/* ============ DATASET / TEMPLATE CARDS ============ */
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem}
.ds-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.15rem;display:flex;flex-direction:column;gap:.5rem;transition:var(--transition)}
.ds-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.ds-card.locked{opacity:.85;border-style:dashed}
.ds-card.owner{border-left:4px solid var(--accent)}
.ds-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.ds-name{font-weight:600;font-size:.95rem;line-height:1.3;word-break:break-word}
.ds-desc{color:var(--text-2);font-size:.8rem;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.ds-meta{display:flex;flex-wrap:wrap;gap:.3rem;font-size:.7rem;color:var(--text-3);padding-top:.3rem}
.chip{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .6rem;background:var(--surface-2);
  border-radius:2rem;font-size:.7rem;color:var(--text-2)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warning-soft);color:var(--warning)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.success{background:var(--success-soft);color:var(--success)}
.chip.purple{background:var(--purple-soft);color:var(--purple)}

/* ============ INNER TABS ============ */
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:1.25rem;overflow-x:auto}
.tab{padding:.7rem 1.1rem;font-size:.875rem;font-weight:500;color:var(--text-2);
  border-bottom:2px solid transparent;transition:var(--transition);white-space:nowrap;
  display:inline-flex;align-items:center;gap:.4rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ============ TABLE ============ */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tbl-scroll{overflow:auto;max-height:640px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
thead th{background:var(--surface-2);color:var(--text-2);font-weight:600;text-align:left;
  padding:.7rem .9rem;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border);
  white-space:nowrap;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
tbody td{padding:.6rem .9rem;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
mark{background:var(--warning-soft);color:var(--warning);padding:0 .15rem;border-radius:3px}

/* ============ SQL EDITOR ============ */
.editor-wrap{background:var(--ed-bg);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--border);margin-bottom:1rem}
.editor-toolbar{display:flex;justify-content:space-between;align-items:center;padding:.55rem .85rem;
  background:var(--ed-tb);border-bottom:1px solid var(--ed-bd);flex-wrap:wrap;gap:.5rem}
.editor-toolbar .group{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.editor-toolbar .hint{color:var(--ed-ln);font-size:.72rem;display:flex;align-items:center;gap:.4rem}
.editor-toolbar .hint kbd{background:rgba(127,127,127,.2);color:var(--ed-fg);padding:.1rem .4rem;
  border-radius:4px;font-family:var(--mono);font-size:.7rem}
.editor-body{display:flex;font-family:var(--mono);font-size:.85rem;min-height:240px;
  max-height:480px;overflow:auto;position:relative;background:var(--ed-bg)}
.ln{padding:.85rem .5rem .85rem .85rem;text-align:right;color:var(--ed-ln);background:var(--ed-bg);
  border-right:1px solid var(--ed-bd);user-select:none;line-height:1.55;font-size:.78rem;min-width:2.8rem}
.sql-editor{flex:1;background:var(--ed-bg);color:var(--ed-fg);border:none;padding:.85rem;
  font-family:var(--mono);font-size:.85rem;line-height:1.55;resize:none;outline:none;min-height:240px;
  white-space:pre;overflow-wrap:normal;overflow-x:auto}
.sql-editor::selection{background:var(--ed-sel)}
.sql-editor:disabled{opacity:.5;cursor:not-allowed}

/* ============ PANELS / MODALS ============ */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.5rem;margin-bottom:1.25rem}
.panel-title{font-size:1.05rem;font-weight:600;margin-bottom:.9rem;display:flex;
  align-items:center;gap:.5rem}
.panel-title i{color:var(--accent)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:1.75rem;max-width:640px;
  width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.modal h3{font-size:1.15rem;font-weight:600;margin-bottom:1rem;display:flex;
  align-items:center;gap:.5rem}
.modal-lg{max-width:900px}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem}

/* ============ DROP ZONE ============ */
.drop-zone{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:2rem;
  text-align:center;cursor:pointer;transition:var(--transition);background:var(--surface-2)}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:var(--accent-soft)}
.drop-zone i{font-size:2.2rem;color:var(--accent);margin-bottom:.6rem;display:block}
.drop-zone .fname{margin-top:.6rem;font-size:.8rem;color:var(--accent);font-weight:500}

/* ============ PROGRESS ============ */
.progress-wrap{margin-top:1rem}
.progress-bar-bg{background:var(--surface-2);border-radius:6px;height:10px;overflow:hidden;border:1px solid var(--border)}
.progress-bar{background:var(--accent);height:100%;width:0;transition:width .2s}
.progress-info{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-2);margin-bottom:.35rem}

/* ============ TOASTS ============ */
#toastBox{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;
  flex-direction:column;gap:.5rem;pointer-events:none}
.toast{background:var(--elevated);border:1px solid var(--border);border-left:4px solid var(--accent);
  padding:.85rem 1.1rem;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);
  font-size:.85rem;min-width:240px;max-width:400px;animation:slideIn .3s ease;pointer-events:auto}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ============ SESSION WARNING ============ */
.session-warning{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--warning);color:#fff;padding:1rem 1.5rem;border-radius:var(--radius);
  box-shadow:var(--shadow-lg);z-index:9999;display:flex;gap:1rem;align-items:center;font-size:.9rem}
.session-warning button{background:rgba(255,255,255,.2);color:#fff;padding:.4rem .9rem;
  border-radius:6px;font-size:.85rem}
.session-warning button:hover{background:rgba(255,255,255,.3)}

/* ============ EMPTY ============ */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text-3)}
.empty i{font-size:2.5rem;display:block;margin-bottom:.75rem;opacity:.5}

/* ============ UTILS ============ */
.flex{display:flex}
.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.gap-2{gap:.5rem}
.gap-3{gap:.75rem}
.gap-4{gap:1rem}
.mt-2{margin-top:.5rem}
.mt-4{margin-top:1rem}
.mb-2{margin-bottom:.5rem}
.mb-4{margin-bottom:1rem}
.text-sm{font-size:.875rem}
.text-xs{font-size:.75rem}
.text-muted{color:var(--text-3)}
.w-full{width:100%}

/* ============ PAGINATION ============ */
.pagination-bar{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;
  border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap;gap:.5rem;font-size:.82rem}
.pagination-controls{display:flex;gap:.35rem;align-items:center}
.page-btn{padding:.3rem .65rem;border:1px solid var(--border);background:var(--surface);
  border-radius:6px;font-size:.78rem;color:var(--text-2);cursor:pointer;transition:var(--transition)}
.page-btn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

.loading-more{text-align:center;padding:1rem;color:var(--text-3);font-size:.82rem}
.loading-more i{margin-right:.5rem}

/* ============ RESPONSIVE ============ */
@media(max-width:768px){
  .main{padding:1.1rem}
  .topbar{padding:.8rem 1rem}
  .main-tabs{padding:.5rem .8rem 0}
  .page-title{font-size:1.35rem}
  .hub-grid{gap:1rem}
  .field-row{grid-template-columns:1fr}
  .modal{padding:1.25rem}
  .notif-panel{width:320px}
}

<script>
/* ============================================================
   EBS R12 Explorer — SPA v3 (Django + Multi-Session + Notifications)
   ============================================================ */

/* ============ STATE ============ */
const state = {
  token: localStorage.getItem('ebs_token') || null,
  refreshToken: localStorage.getItem('ebs_refresh') || null,
  user: null,
  view: 'hub',

  // Datasets
  datasets: { my: [], all: [] },
  activeDataset: null,
  lastResult: null,

  // Editor
  editorDatasetId: null,
  pendingEditorSQL: null,
  editorPagination: { page: 1, perPage: 50, total: 0, allRows: [] },

  // EBS
  ebsSessions: [],
  activeEbsSessionKey: null,
  ebsLastResult: null,
  ebsPagination: { page: 1, perPage: 50, total: 0, allRows: [] },

  // Notifications
  notifications: [],
  notifUnreadCount: 0,
  notifPanelOpen: false,
  notifPollInterval: null,

  // Editor Sessions (persist across reload)
  editorSessions: [],
  activeEditorSessionKey: null,
  editorSqlState: {},

  // Settings
  publicSettings: {
    site_name: 'EBS R12 Explorer',
    site_tagline: 'Oracle EBS R12 Schema & Dataset Explorer',
    announcement: '',
    brand_color: '#2563eb'
  },

  // Session Timer
  lastActivity: Date.now(),
  sessionWarningShown: false,

  // Preferences
  editorTheme: localStorage.getItem('ebs_editor_theme') || 'vs-dark',
  editorCase: localStorage.getItem('ebs_editor_case') || 'upper',
};

const API_BASE = '/api';
const SESSION_TIMEOUT_MS = 20 * 60 * 1000;      // 20 min
const SESSION_WARNING_MS = 60 * 1000;            // 1 min warning
const ACTIVITY_REFRESH_MS = 5 * 60 * 1000;       // refresh token every 5 min
const NOTIF_POLL_MS = 30 * 1000;                 // poll every 30s
const AUTOSAVE_DEBOUNCE_MS = 3000;               // save editor every 3s

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ============ INIT PREFERENCES ============ */
(function initPrefs() {
  // Theme
  const savedTheme = localStorage.getItem('ebs_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
  document.body.classList.toggle('dark', isDark);

  // Editor theme
  const edTheme = localStorage.getItem('ebs_editor_theme') || 'vs-dark';
  document.body.className = document.body.className
    .split(' ').filter(c => !c.startsWith('ed-theme-')).join(' ');
  document.body.classList.add('ed-theme-' + edTheme);

  updateThemeIcon();
  updateEditorThemeIcon();
})();

/* ============ API HELPER (auto-refresh) ============ */
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  const isFormData = opts.body instanceof FormData;
  if (!isFormData) headers['Content-Type'] = 'application/json';
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;

  const url = path.startsWith('http') ? path : API_BASE + path;
  const res = await fetch(url, { ...opts, headers });

  if (res.status === 401 && state.refreshToken && !opts._retried) {
    const refreshed = await tryRefreshToken();
    if (refreshed) {
      return api(path, { ...opts, _retried: true });
    } else {
      forceLogout('Session expired. Please login again.');
      throw new Error('Session expired');
    }
  }

  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function tryRefreshToken() {
  if (!state.refreshToken) return false;
  try {
    const res = await fetch(API_BASE + '/auth/refresh/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh: state.refreshToken })
    });
    if (!res.ok) return false;
    const data = await res.json();
    if (data.token) {
      state.token = data.token;
      localStorage.setItem('ebs_token', data.token);
      return true;
    }
  } catch (e) {}
  return false;
}

/* ============ TOAST ============ */
function toast(msg, type = 'info', duration = 3500) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? 'fa-check-circle'
             : type === 'error' ? 'fa-exclamation-circle'
             : type === 'warn' ? 'fa-exclamation-triangle'
             : 'fa-info-circle';
  el.innerHTML = `<i class="fas ${icon}"></i> ${esc(msg)}`;
  $('#toastBox').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

/* ============ HELPERS ============ */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function highlight(text, term) {
  if (!term) return esc(text);
  const safe = esc(text);
  const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}
function fmtDate(s) {
  if (!s) return '—';
  try { return new Date(s).toLocaleString(); } catch { return s; }
}
function fmtRelative(s) {
  if (!s) return '—';
  try {
    const d = new Date(s);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
    return d.toLocaleDateString();
  } catch { return s; }
}
function fmtNum(n) { return Number(n || 0).toLocaleString(); }
function fmtBytes(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(2) + ' MB';
  return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function debounce(fn, ms = 200) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function download(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

/* ============ THEME TOGGLE ============ */
function updateThemeIcon() {
  const isDark = document.body.classList.contains('dark');
  const btn = $('#themeBtn');
  if (btn) btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
}
function updateEditorThemeIcon() {
  // (Optional: could add UI toggle)
}
document.addEventListener('click', e => {
  if (e.target.closest('#themeBtn')) {
    document.body.classList.toggle('dark');
    localStorage.setItem('ebs_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    updateThemeIcon();
  }
});

/* ============ SETUP WIZARD ============ */
async function checkSetup() {
  try {
    const res = await fetch(API_BASE + '/setup/status/');
    const data = await res.json();
    return data;
  } catch (e) {
    return { setup_complete: true };
  }
}

async function doSetup() {
  const fullName = $('#setupFullName').value.trim();
  const email = $('#setupEmail').value.trim();
  const pass = $('#setupPass').value;
  const pass2 = $('#setupPass2').value;

  if (!pass || pass.length < 8) {
    $('#setupErr').textContent = 'Password must be at least 8 characters';
    return;
  }
  if (pass !== pass2) {
    $('#setupErr').textContent = 'Passwords do not match';
    return;
  }

  $('#setupErr').textContent = '';
  const btn = $('#setupBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

  try {
    const res = await fetch(API_BASE + '/setup/create-admin/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: 'ADMIN',
        password: pass,
        password2: pass2,
        full_name: fullName,
        email: email,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Setup failed');
    toast('Administrator created! Please sign in.', 'success');
    $('#setupScreen').classList.add('hidden');
    $('#loginScreen').classList.remove('hidden');
    $('#loginUser').value = 'ADMIN';
    $('#loginPass').focus();
  } catch (err) {
    $('#setupErr').textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-shield-alt"></i> Create Administrator';
  }
}

/* ============ PUBLIC SETTINGS ============ */
async function loadPublicSettings() {
  try {
    const res = await fetch(API_BASE + '/public/settings/');
    const s = await res.json();
    state.publicSettings = { ...state.publicSettings, ...s };
  } catch (e) {}

  const name = state.publicSettings.site_name || 'EBS R12 Explorer';
  const tag = state.publicSettings.site_tagline || '';
  const color = state.publicSettings.brand_color || '#2563eb';

  const ln = $('#loginSiteName'); if (ln) ln.textContent = name;
  const lt = $('#loginTagline'); if (lt) lt.textContent = tag;
  const bn = $('#brandName'); if (bn) bn.textContent = name;
  const bt = $('#brandTagline'); if (bt) bt.textContent = tag;

  document.documentElement.style.setProperty('--accent', color);
  document.title = name;
}

/* ============ AUTH ============ */
async function doLogin() {
  const username = $('#loginUser').value.trim();
  const password = $('#loginPass').value;
  if (!username || !password) {
    $('#loginErr').textContent = 'Please fill both fields.';
    return;
  }
  $('#loginErr').textContent = '';
  const btn = $('#loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';

  try {
    const res = await fetch(API_BASE + '/auth/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    state.token = data.token;
    state.refreshToken = data.refresh;
    state.user = data.user;
    // Load user preferences
    state.editorTheme = data.user.editor_theme || 'vs-dark';
    state.editorCase = data.user.editor_case || 'upper';
    applyEditorPreferences();

    localStorage.setItem('ebs_token', data.token);
    localStorage.setItem('ebs_refresh', data.refresh);
    localStorage.setItem('ebs_editor_theme', state.editorTheme);
    localStorage.setItem('ebs_editor_case', state.editorCase);

    showApp();
    toast(`Welcome, ${data.user.username}`, 'success');
  } catch (err) {
    $('#loginErr').textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign in';
  }
}

async function logout() {
  // Close all EBS sessions
  try { await api('/ebs/disconnect/', { method: 'POST', body: JSON.stringify({}) }); } catch (e) {}
  // Clear notifications polling
  if (state.notifPollInterval) {
    clearInterval(state.notifPollInterval);
    state.notifPollInterval = null;
  }
  // Reset state
  state.token = null;
  state.refreshToken = null;
  state.user = null;
  state.ebsSessions = [];
  state.activeEbsSessionKey = null;
  state.ebsLastResult = null;
  state.lastResult = null;
  state.activeDataset = null;

  localStorage.removeItem('ebs_token');
  localStorage.removeItem('ebs_refresh');

  $('#app').classList.add('hidden');
  $('#loginScreen').classList.remove('hidden');
  $('#loginUser').value = '';
  $('#loginPass').value = '';
  $('#loginErr').textContent = '';
  $('#sessionWarningRoot').innerHTML = '';
  state.sessionWarningShown = false;
}

function forceLogout(msg) {
  toast(msg || 'Logged out', 'warn');
  setTimeout(logout, 800);
}

async function restoreSession() {
  if (!state.token) return false;
  try {
    const me = await api('/auth/me/');
    state.user = me;
    state.editorTheme = me.editor_theme || 'vs-dark';
    state.editorCase = me.editor_case || 'upper';
    applyEditorPreferences();
    showApp();
    return true;
  } catch {
    logout();
    return false;
  }
}

function showApp() {
  $('#loginScreen').classList.add('hidden');
  $('#setupScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#chipName').textContent = state.user.username;
  $('#chipRole').textContent = '· ' + roleLabel(state.user.role);
  renderTabs();
  navigate('hub');
  startSessionTimer();
  startNotificationPolling();
  checkEbsSessions();
  loadEditorSessions();
}

function roleLabel(role) {
  return { ADMIN: 'Admin', CONSULTANT: 'Consultant', USER: 'User' }[role] || role;
}

/* ============ APPLY EDITOR PREFERENCES ============ */
function applyEditorPreferences() {
  // Editor theme
  document.body.className = document.body.className
    .split(' ').filter(c => !c.startsWith('ed-theme-')).join(' ');
  document.body.classList.add('ed-theme-' + (state.editorTheme || 'vs-dark'));
}

/* ============ SESSION TIMER (Auto-logout 20 min) ============ */
let _sessionInterval = null;
let _lastTokenRefresh = 0;

function startSessionTimer() {
  ['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(ev => {
    document.addEventListener(ev, markActivity, { passive: true });
  });
  if (_sessionInterval) clearInterval(_sessionInterval);
  _sessionInterval = setInterval(checkSession, 15000);
}

function markActivity() {
  state.lastActivity = Date.now();
  state.sessionWarningShown = false;
  const w = $('#sessionWarningRoot');
  if (w && w.innerHTML) w.innerHTML = '';

  const now = Date.now();
  if (now - _lastTokenRefresh > ACTIVITY_REFRESH_MS && state.refreshToken) {
    _lastTokenRefresh = now;
    tryRefreshToken().catch(() => {});
    // Extend EBS sessions
    if (state.ebsSessions.length > 0) {
      state.ebsSessions.forEach(s => {
        api('/ebs/session/extend/', {
          method: 'POST',
          body: JSON.stringify({ session_key: s.session_key })
        }).catch(() => {});
      });
    }
  }
}

async function checkSession() {
  if (!state.user) return;
  const idle = Date.now() - state.lastActivity;

  if (idle >= SESSION_TIMEOUT_MS) {
    try { await api('/ebs/disconnect/', { method: 'POST', body: JSON.stringify({}) }); } catch (e) {}
    forceLogout('Session expired due to inactivity.');
    return;
  }

  if (idle >= SESSION_TIMEOUT_MS - SESSION_WARNING_MS && !state.sessionWarningShown) {
    state.sessionWarningShown = true;
    showSessionWarning();
  }

  // Refresh EBS sessions count
  checkEbsSessions();
}

function showSessionWarning() {
  const root = $('#sessionWarningRoot');
  const remaining = Math.max(0, Math.ceil((SESSION_TIMEOUT_MS - (Date.now() - state.lastActivity)) / 1000));
  root.innerHTML = `
    <div class="session-warning">
      <i class="fas fa-clock" style="font-size:1.3rem"></i>
      <div>
        <div style="font-weight:600">Session expiring soon</div>
        <div style="font-size:.8rem;opacity:.9">You'll be logged out in <span id="sessCount">${remaining}</span>s due to inactivity.</div>
      </div>
      <button id="stayBtn">Stay signed in</button>
    </div>
  `;
  $('#stayBtn').addEventListener('click', () => {
    markActivity();
    root.innerHTML = '';
  });
  const iv = setInterval(() => {
    const el = $('#sessCount');
    if (!el) { clearInterval(iv); return; }
    const r = Math.max(0, Math.ceil((SESSION_TIMEOUT_MS - (Date.now() - state.lastActivity)) / 1000));
    el.textContent = r;
    if (r <= 0) clearInterval(iv);
  }, 1000);
}

/* ============ NOTIFICATIONS ENGINE ============ */
async function loadNotifications() {
  if (!state.user) return;
  try {
    const r = await api('/notifications/?limit=50');
    state.notifications = r.notifications || [];
    state.notifUnreadCount = r.unread_count || 0;
    updateNotifBadge();
  } catch (e) {}
}

function updateNotifBadge() {
  const dot = $('#notifDot');
  if (!dot) return;
  const c = state.notifUnreadCount;
  if (c > 0) {
    dot.classList.remove('hidden');
    dot.textContent = c > 99 ? '99+' : c;
  } else {
    dot.classList.add('hidden');
  }
}

function startNotificationPolling() {
  if (state.notifPollInterval) clearInterval(state.notifPollInterval);
  loadNotifications();
  state.notifPollInterval = setInterval(() => {
    if (state.user && document.visibilityState === 'visible') {
      loadNotifications();
    }
  }, NOTIF_POLL_MS);
}

function toggleNotifPanel() {
  const root = $('#notifRoot');
  if (state.notifPanelOpen) {
    root.innerHTML = '';
    state.notifPanelOpen = false;
    return;
  }

  // Render panel
  const btn = $('#notifBtn');
  const rect = btn.getBoundingClientRect();
  root.innerHTML = `
    <div class="notif-panel" style="position:fixed;top:${rect.bottom + 8}px;right:${window.innerWidth - rect.right}px">
      <div class="notif-header">
        <h3><i class="fas fa-bell"></i> Notifications ${state.notifUnreadCount > 0 ? `(${state.notifUnreadCount})` : ''}</h3>
        <div style="display:flex;gap:.25rem">
          ${state.notifUnreadCount > 0 ? `<button class="btn btn-ghost btn-xs" id="markAllReadBtn" title="Mark all read"><i class="fas fa-check-double"></i></button>` : ''}
          <button class="btn btn-ghost btn-xs" id="closeNotifBtn" title="Close"><i class="fas fa-times"></i></button>
        </div>
      </div>
      ${state.notifications.length === 0 ? `
        <div class="empty" style="padding:2rem 1rem">
          <i class="fas fa-bell-slash"></i>
          No notifications
        </div>
      ` : state.notifications.map(n => `
        <div class="notif-item ${!n.is_read ? 'unread' : ''}" data-id="${n.id}" data-link="${esc(n.link || '')}">
          <div class="notif-icon ${esc(n.level || 'info')}">
            <i class="fas ${esc(n.icon || 'fa-bell')}"></i>
          </div>
          <div class="notif-body">
            <div class="notif-title">${esc(n.title)}</div>
            ${n.message ? `<div class="notif-msg">${esc(n.message)}</div>` : ''}
            <div class="notif-time">${fmtRelative(n.created_at)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  state.notifPanelOpen = true;

  // Events
  $('#closeNotifBtn').addEventListener('click', () => {
    root.innerHTML = '';
    state.notifPanelOpen = false;
  });
  const markAll = $('#markAllReadBtn');
  if (markAll) markAll.addEventListener('click', markAllNotificationsRead);

  $$('.notif-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.id);
      const link = el.dataset.link;
      markNotificationRead(id);
      if (link) {
        root.innerHTML = '';
        state.notifPanelOpen = false;
        navigate(link);
      }
    });
  });
}

async function markNotificationRead(id) {
  try {
    await api(`/notifications/${id}/read/`, { method: 'PUT' });
    const n = state.notifications.find(x => x.id === id);
    if (n && !n.is_read) {
      n.is_read = true;
      state.notifUnreadCount = Math.max(0, state.notifUnreadCount - 1);
      updateNotifBadge();
      const el = document.querySelector(`.notif-item[data-id="${id}"]`);
      if (el) el.classList.remove('unread');
    }
  } catch (e) {}
}

async function markAllNotificationsRead() {
  try {
    await api('/notifications/read-all/', { method: 'PUT' });
    state.notifications.forEach(n => { n.is_read = true; });
    state.notifUnreadCount = 0;
    updateNotifBadge();
    if (state.notifPanelOpen) toggleNotifPanel();
  } catch (e) {}
}

/* ============ PAGINATION RENDERER ============ */
function renderPagination(containerId, total, page, perPage, onPageChange) {
  const container = $('#' + containerId);
  if (!container) return;
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  const start = (page - 1) * perPage + 1;
  const end = Math.min(page * perPage, total);

  let pageBtns = '';
  const maxBtns = 5;
  let startPage = Math.max(1, page - Math.floor(maxBtns / 2));
  let endPage = Math.min(totalPages, startPage + maxBtns - 1);
  if (endPage - startPage < maxBtns - 1) startPage = Math.max(1, endPage - maxBtns + 1);

  if (startPage > 1) {
    pageBtns += `<button class="page-btn" data-page="1">1</button>`;
    if (startPage > 2) pageBtns += `<span style="padding:0 .25rem;color:var(--text-3)">…</span>`;
  }
  for (let i = startPage; i <= endPage; i++) {
    pageBtns += `<button class="page-btn ${i === page ? 'active' : ''}" data-page="${i}">${i}</button>`;
  }
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) pageBtns += `<span style="padding:0 .25rem;color:var(--text-3)">…</span>`;
    pageBtns += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
  }

  container.innerHTML = `
    <div class="pagination-bar">
      <div class="text-xs text-muted">
        Showing <strong>${fmtNum(start)}–${fmtNum(end)}</strong> of <strong>${fmtNum(total)}</strong>
      </div>
      <div class="pagination-controls">
        <button class="page-btn" data-page="${Math.max(1, page - 1)}" ${page === 1 ? 'disabled' : ''}>
          <i class="fas fa-chevron-left"></i>
        </button>
        ${pageBtns}
        <button class="page-btn" data-page="${Math.min(totalPages, page + 1)}" ${page === totalPages ? 'disabled' : ''}>
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  `;

  container.querySelectorAll('.page-btn[data-page]').forEach(b => {
    b.addEventListener('click', () => {
      const p = parseInt(b.dataset.page);
      if (p !== page && !isNaN(p)) onPageChange(p);
    });
  });
}

      <button class="filter-chip" data-mode="column"><i class="fas fa-columns"></i> COLUMN_NAME</button>
      <button class="filter-chip" data-mode="both"><i class="fas fa-layer-group"></i> Both</button>
      <button class="filter-chip" data-mode="all"><i class="fas fa-asterisk"></i> All</button>
      ${hasOwner ? `<select class="filter-select" id="fOwner"><option value="">All Owners</option>${owners.map(o => `<option value="${o}">${esc(o)}</option>`).join('')}</select>` : ''}
      ${hasTs ? `<select class="filter-select" id="fTs"><option value="">All Tablespaces</option>${tspaces.map(t => `<option value="${t}">${esc(t)}</option>`).join('')}</select>` : ''}
      ${hasStatus ? `<select class="filter-select" id="fStatus"><option value="">All Status</option>${statuses.map(s => `<option value="${s}">${esc(s)}</option>`).join('')}</select>` : ''}
      <button class="filter-chip" id="resetFilters"><i class="fas fa-rotate-left"></i> Reset</button>
    </div>

    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table id="catTable">
          <thead><tr>${colNames.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="catPagination"></div>
    </div>
  `;

  const sInp = $('#catSearch');
  const clearBtn = $('#catClear');
  const fOwner = $('#fOwner');
  const fTs = $('#fTs');
  const fStatus = $('#fStatus');

  let currentPage = 1;
  const PER_PAGE = 50;
  let filteredRows = [];

  function filterRows() {
    const t = term.trim().toLowerCase();
    clearBtn.classList.toggle('hidden', !t);

    return rows.filter(r => {
      if (t) {
        let hit = false;
        if (searchMode === 'table') {
          if (hasTableName) hit = String(r[tableNameCol] ?? '').toLowerCase().includes(t);
          else hit = Object.values(r).some(v => String(v ?? '').toLowerCase().includes(t));
        } else if (searchMode === 'column') {
          const hasColNameField = Object.keys(r).some(k => k.toUpperCase() === 'COLUMN_NAME');
          if (hasColNameField) {
            hit = Object.entries(r).some(([k, v]) =>
              k.toUpperCase() === 'COLUMN_NAME' && String(v ?? '').toLowerCase().includes(t));
          } else {
            hit = colNames.some(c => c.toLowerCase().includes(t));
          }
        } else if (searchMode === 'both') {
          const inTable = hasTableName && String(r[tableNameCol] ?? '').toLowerCase().includes(t);
          const hasColNameField = Object.keys(r).some(k => k.toUpperCase() === 'COLUMN_NAME');
          let inCol = false;
          if (hasColNameField) {
            inCol = Object.entries(r).some(([k, v]) =>
              k.toUpperCase() === 'COLUMN_NAME' && String(v ?? '').toLowerCase().includes(t));
          } else {
            inCol = colNames.some(c => c.toLowerCase().includes(t));
          }
          hit = inTable || inCol;
        } else {
          hit = Object.values(r).some(v => String(v ?? '').toLowerCase().includes(t));
        }
        if (!hit) return false;
      }
      if (fOwner?.value && r.OWNER !== fOwner.value) return false;
      if (fTs?.value && r.TABLESPACE_NAME !== fTs.value) return false;
      if (fStatus?.value && r.STATUS !== fStatus.value) return false;
      return true;
    });
  }

  function paint() {
    filteredRows = filterRows();
    $('#catFiltered').textContent = fmtNum(filteredRows.length);
    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const start = (currentPage - 1) * PER_PAGE;
    const end = start + PER_PAGE;
    const pageRows = filteredRows.slice(start, end);

    const tb = $('#catTable tbody');
    if (!pageRows.length) {
      tb.innerHTML = `<tr><td colspan="${colNames.length}"><div class="empty"><i class="fas fa-inbox"></i>No matches</div></td></tr>`;
    } else {
      const t = term.trim().toLowerCase();
      tb.innerHTML = pageRows.map(r => `
        <tr>
          ${colNames.map(c => {
            const val = r[c];
            if (val === null || val === undefined)
              return `<td><span style="color:var(--text-3)">NULL</span></td>`;
            const str = typeof val === 'object' ? JSON.stringify(val) : String(val);
            if (c === 'STATUS' && (str === 'VALID' || str === 'INVALID')) {
              return `<td><span class="chip ${str === 'VALID' ? 'success' : 'danger'}">${esc(str)}</span></td>`;
            }
            if (c === 'NUM_ROWS' && typeof val === 'number')
              return `<td>${fmtNum(val)}</td>`;
            const content = (hasTableName && c === tableNameCol)
              ? `<strong>${highlight(str, t)}</strong>`
              : esc(str);
            return `<td>${content}</td>`;
          }).join('')}
        </tr>`).join('');
    }

    renderPagination('catPagination', filteredRows.length, currentPage, PER_PAGE, (p) => {
      currentPage = p;
      renderPage();
      // Scroll to top of table
      $('.tbl-scroll')?.scrollTo(0, 0);
    });
  }

  const logSearch = debounce(() => {
    if (term.trim().length >= 2 && sourceMeta) {
      api('/search-log/', {
        method: 'POST',
        body: JSON.stringify({
          term: term.trim(),
          search_type: searchMode,
          dataset_id: sourceMeta.id,
          table_hit: term.trim()
        })
      }).catch(() => {});
    }
  }, 800);

  sInp.addEventListener('input', e => { term = e.target.value; paint(); logSearch(); });
  clearBtn.addEventListener('click', () => { term = ''; sInp.value = ''; paint(); sInp.focus(); });
  fOwner?.addEventListener('change', paint);
  fTs?.addEventListener('change', paint);
  fStatus?.addEventListener('change', paint);
  $('#resetFilters').addEventListener('click', () => {
    term = ''; sInp.value = '';
    if (fOwner) fOwner.value = '';
    if (fTs) fTs.value = '';
    if (fStatus) fStatus.value = '';
    paint(); sInp.focus();
  });
  $$('.filter-chip[data-mode]').forEach(b => b.addEventListener('click', () => {
    $$('.filter-chip[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    searchMode = b.dataset.mode;
    paint();
  }));

  paint();
}

async function renderLakesTab(tab) {
  const c = $('#lakesContent');
  c.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';

  if (tab === 'upload') return renderUploadTab(c);

  if (tab === 'my') {
    try { state.datasets.my = await api('/datasets/my/'); }
    catch (err) { toast(err.message, 'error'); state.datasets.my = []; }
    if (!state.datasets.my.length) {
      c.innerHTML = `<div class="empty"><i class="fas fa-cloud-upload-alt"></i>
        No uploads yet. Go to <strong>Upload</strong> tab to add your first dataset.</div>`;
      return;
    }
    c.innerHTML = '<div class="ds-grid" id="myGrid"></div>';
    paintDatasetGrid('#myGrid', state.datasets.my);
    return;
  }

  if (tab === 'all') {
    try { state.datasets.all = await api('/datasets/all/'); }
    catch (err) { toast(err.message, 'error'); state.datasets.all = []; }

    c.innerHTML = `
      <div class="search-bar">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="allSearch" placeholder="Search by name, uploader, format…">
        <button class="clear hidden" id="allClear"><i class="fas fa-times"></i></button>
      </div>
      <div class="filters">
        <button class="filter-chip active" data-f="all">All</button>
        <button class="filter-chip" data-f="accessible">Accessible</button>
        <button class="filter-chip" data-f="mine">Mine</button>
        <button class="filter-chip" data-f="locked">Locked 🔒</button>
      </div>
      <div class="ds-grid" id="allGrid"></div>
    `;
    let filterMode = 'all';
    const sInp = $('#allSearch');
    const clearBtn = $('#allClear');

    function paint() {
      const term = sInp.value.trim().toLowerCase();
      clearBtn.classList.toggle('hidden', !term);
      let list = state.datasets.all;
      if (filterMode === 'accessible') list = list.filter(d => d.accessible);
      else if (filterMode === 'mine') list = list.filter(d => d.uploaded_by === state.user.username);
      else if (filterMode === 'locked') list = list.filter(d => !d.accessible);
      if (term) {
        list = list.filter(d =>
          (d.name || '').toLowerCase().includes(term) ||
          (d.uploaded_by || '').toLowerCase().includes(term) ||
          (d.description || '').toLowerCase().includes(term) ||
          (d.source_format || '').toLowerCase().includes(term)
        );
      }
      if (!list.length) {
        $('#allGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="fas fa-inbox"></i>No datasets</div>';
        return;
      }
      paintDatasetGrid('#allGrid', list);
    }
    paint();
    sInp.addEventListener('input', paint);
    clearBtn.addEventListener('click', () => { sInp.value = ''; paint(); });
    $$('.filter-chip[data-f]').forEach(b => b.addEventListener('click', () => {
      $$('.filter-chip[data-f]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      filterMode = b.dataset.f;
      paint();
    }));
    return;
  }

  if (tab === 'trash') {
    try {
      const list = await api('/datasets/trash/');
      if (!list.length) {
        c.innerHTML = '<div class="empty"><i class="fas fa-trash"></i>Trash is empty.</div>';
        return;
      }
      c.innerHTML = `
        <div class="announce">
          <i class="fas fa-info-circle"></i>
          <div class="announce-content">
            Datasets in trash are permanently deleted after 30 days.
          </div>
        </div>
        <div class="tbl-wrap">
          <div class="tbl-scroll">
            <table>
              <thead><tr>
                <th>Name</th><th>Uploaded By</th><th>Deleted At</th><th>Rows</th><th>Format</th><th>Actions</th>
              </tr></thead>
              <tbody>
                ${list.map(d => `
                  <tr>
                    <td><strong>${esc(d.name)}</strong></td>
                    <td>${esc(d.uploaded_by)}</td>
                    <td>${fmtDate(d.deleted_at)}</td>
                    <td>${fmtNum(d.row_count)}</td>
                    <td>${esc(d.source_format || '—')}</td>
                    <td>
                      <button class="btn btn-success btn-xs restoreBtn" data-id="${d.id}"><i class="fas fa-undo"></i> Restore</button>
                      <button class="btn btn-danger btn-xs purgeBtn" data-id="${d.id}" data-name="${esc(d.name)}"><i class="fas fa-times"></i> Purge</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      $$('.restoreBtn').forEach(b => b.addEventListener('click', async () => {
        try {
          await api(`/datasets/${b.dataset.id}/restore/`, { method: 'PUT' });
          toast('Restored', 'success');
          renderLakesTab('trash');
        } catch (err) { toast(err.message, 'error'); }
      }));
      $$('.purgeBtn').forEach(b => b.addEventListener('click', async () => {
        if (!confirm(`Permanently delete "${b.dataset.name}"? This cannot be undone.`)) return;
        try {
          await api(`/datasets/${b.dataset.id}/permanent/`, { method: 'DELETE' });
          toast('Purged', 'success');
          renderLakesTab('trash');
        } catch (err) { toast(err.message, 'error'); }
      }));
    } catch (err) {
      c.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i>${esc(err.message)}</div>`;
    }
  }
}

/* ============ DATASET GRID ============ */
function paintDatasetGrid(sel, list) {
  const el = $(sel);
  if (!el) return;
  el.innerHTML = list.map(d => {
    const isLocked = !d.accessible && !d.is_owner;
    const isOwner = d.uploaded_by === state.user.username;
    const pending = d.pending_request;
    const sizeStr = d.size_bytes ? fmtBytes(d.size_bytes) : '';
    return `
      <div class="ds-card ${isLocked ? 'locked' : ''} ${isOwner ? 'owner' : ''}">
        <div class="ds-head">
          <div class="ds-name">${esc(d.name)} ${isLocked ? '<i class="fas fa-lock" style="color:var(--warning)"></i>' : ''}</div>
          ${isOwner
            ? '<span class="chip accent"><i class="fas fa-user"></i> Yours</span>'
            : isLocked
              ? '<span class="chip warn">Locked</span>'
              : '<span class="chip success"><i class="fas fa-check"></i> Access</span>'}
        </div>
        <div class="ds-desc">${esc(d.description || 'No description')}</div>
        <div class="ds-meta">
          <span><i class="fas fa-user"></i> ${esc(d.uploaded_by)}</span>
          <span><i class="fas fa-clock"></i> ${fmtDate(d.uploaded_at)}</span>
        </div>
        <div class="ds-meta">
          <span class="chip"><i class="fas fa-table"></i> ${fmtNum(d.row_count)} rows</span>
          <span class="chip"><i class="fas fa-columns"></i> ${d.column_count} cols</span>
          ${sizeStr ? `<span class="chip"><i class="fas fa-database"></i> ${sizeStr}</span>` : ''}
          <span class="chip"><i class="fas fa-file"></i> ${esc(d.source_format || '—')}</span>
        </div>
        <div style="display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap">
          ${isLocked ? (
            pending
              ? '<span class="chip warn"><i class="fas fa-clock"></i> Request pending</span>'
              : `<button class="btn btn-outline btn-sm reqAccessBtn" data-id="${d.id}"><i class="fas fa-key"></i> Request Access</button>`
          ) : (
            `<button class="btn btn-primary btn-sm openDsBtn" data-id="${d.id}"><i class="fas fa-terminal"></i> Open</button>`
          )}
          ${state.user.role === 'ADMIN' ? `
            <button class="btn btn-ghost btn-sm shareDsBtn" data-id="${d.id}" data-name="${esc(d.name)}"><i class="fas fa-share-nodes"></i></button>
            <button class="btn btn-ghost btn-sm editDsBtn" data-id="${d.id}" data-name="${esc(d.name)}" data-desc="${esc(d.description || '')}" data-tags="${esc(d.tags || '')}" data-private="${d.private ? 1 : 0}"><i class="fas fa-pen"></i></button>
            <button class="btn btn-ghost btn-sm delDsBtn" data-id="${d.id}" data-name="${esc(d.name)}"><i class="fas fa-trash" style="color:var(--danger)"></i></button>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  $$('.openDsBtn').forEach(b => b.addEventListener('click', () => openDataset(parseInt(b.dataset.id))));
  $$('.reqAccessBtn').forEach(b => b.addEventListener('click', () => requestAccess(parseInt(b.dataset.id))));
  $$('.editDsBtn').forEach(b => b.addEventListener('click', () => editDatasetModal(b.dataset)));
  $$('.delDsBtn').forEach(b => b.addEventListener('click', () => softDeleteDataset(parseInt(b.dataset.id), b.dataset.name)));
  $$('.shareDsBtn').forEach(b => b.addEventListener('click', () => openShareModal(parseInt(b.dataset.id), b.dataset.name)));
}

/* ============ UPLOAD TAB ============ */
function renderUploadTab(c) {
  const isUserRole = state.user.role === 'USER';
  c.innerHTML = `
    <div class="panel">
      <div class="panel-title"><i class="fas fa-cloud-upload-alt"></i> Upload New Dataset</div>
      <p class="text-xs text-muted mb-4">
        Accepted: <strong>JSON · CSV · TSV · SQL · Excel · YAML · XML · HTML · PDF · TXT · ZIP</strong>
      </p>

      <div class="field"><label>Dataset Name *</label>
        <input id="upName" placeholder="e.g. EBS Prod Backup 2026"></div>
      <div class="field"><label>Description</label>
        <input id="upDesc" placeholder="Short note (optional)"></div>
      <div class="field-row">
        <div class="field"><label>Tags</label>
          <input id="upTags" placeholder="e.g. prod, gl"></div>
        <div class="field"><label>Privacy</label>
          ${isUserRole ? `
            <input value="Private (forced for USER role)" disabled style="opacity:.7">
          ` : `
            <select id="upPrivate">
              <option value="true">Private (only me + Admin)</option>
              <option value="false">Public (all users)</option>
            </select>
          `}
        </div>
      </div>
      <div class="field"><label>File *</label>
        <div class="drop-zone" id="dropZone">
          <i class="fas fa-file-upload"></i>
          <div>Drop file here or click to browse</div>
          <div class="fname" id="upFileName"></div>
          <input type="file" id="upFile"
            accept=".json,.csv,.tsv,.sql,.xlsx,.xls,.xlsm,.yaml,.yml,.xml,.html,.htm,.pdf,.txt,.zip"
            style="display:none">
        </div>
      </div>

      <div id="upProgressWrap" class="progress-wrap hidden">
        <div class="progress-info">
          <span id="upStatus">Uploading…</span>
          <span id="upPercent">0%</span>
        </div>
        <div class="progress-bar-bg"><div id="upBar" class="progress-bar"></div></div>
      </div>

      <button class="btn btn-primary" id="upBtn" style="margin-top:.75rem">
        <i class="fas fa-upload"></i> Upload Dataset
      </button>
    </div>
  `;

  const dz = $('#dropZone');
  const fi = $('#upFile');
  dz.addEventListener('click', () => fi.click());
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.remove('dragover');
  }));
  dz.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) { fi.files = e.dataTransfer.files; updName(); }
  });
  fi.addEventListener('change', updName);
  function updName() {
    const f = fi.files[0];
    $('#upFileName').textContent = f ? `${f.name} (${fmtBytes(f.size)})` : '';
  }

  $('#upBtn').addEventListener('click', () => {
    const name = $('#upName').value.trim();
    const desc = $('#upDesc').value.trim();
    const tags = $('#upTags').value.trim();
    const priv = isUserRole ? true : ($('#upPrivate')?.value === 'true');

    if (!name) return toast('Dataset name required', 'error');
    if (!fi.files.length) return toast('Please select a file', 'error');

    const file = fi.files[0];
    const fd = new FormData();
    fd.append('file', file);
    fd.append('name', name);
    fd.append('description', desc);
    fd.append('tags', tags);
    fd.append('private', priv ? 'true' : 'false');

    const btn = $('#upBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading…';
    $('#upProgressWrap').classList.remove('hidden');
    $('#upStatus').textContent = `Uploading ${file.name}…`;
    $('#upBar').style.width = '0%';
    $('#upPercent').textContent = '0%';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', API_BASE + '/datasets/upload/');
    xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);

    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        $('#upBar').style.width = pct + '%';
        $('#upPercent').textContent = pct + '%';
        if (pct >= 100) $('#upStatus').textContent = 'Processing on server…';
      }
    });

    xhr.addEventListener('load', () => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-upload"></i> Upload Dataset';
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const r = JSON.parse(xhr.responseText);
          toast(`Uploaded: ${r.name} (${fmtNum(r.row_count)} rows)`, 'success');
          $('#upName').value = ''; $('#upDesc').value = ''; $('#upTags').value = '';
          fi.value = ''; updName();
          setTimeout(() => $('#upProgressWrap').classList.add('hidden'), 800);
          loadNotifications();
          $$('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === 'my'));
          renderLakesTab('my');
        } catch (e) { toast('Upload complete', 'success'); }
      } else {
        try {
          const err = JSON.parse(xhr.responseText);
          toast(err.error || 'Upload failed', 'error');
        } catch (e) { toast(`Upload failed (HTTP ${xhr.status})`, 'error'); }
        $('#upProgressWrap').classList.add('hidden');
      }
    });

    xhr.addEventListener('error', () => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-upload"></i> Upload Dataset';
      toast('Upload failed — network error', 'error');
      $('#upProgressWrap').classList.add('hidden');
    });

    xhr.send(fd);
  });
}

/* ============ DATASET ACTIONS ============ */
async function requestAccess(id) {
  try {
    await api('/access-requests/request/', { method: 'POST', body: JSON.stringify({ dataset_id: id }) });
    toast('Access request submitted', 'success');
    renderLakesTab('all');
  } catch (err) { toast(err.message, 'error'); }
}

async function softDeleteDataset(id, name) {
  if (!confirm(`Move "${name}" to trash?`)) return;
  try {
    await api(`/datasets/${id}/delete/`, { method: 'DELETE' });
    toast('Moved to trash', 'success');
    render();
  } catch (err) { toast(err.message, 'error'); }
}

function editDatasetModal(d) {
  $('#modalRoot').innerHTML = `
    <div class="modal-bg" id="mBg">
      <div class="modal">
        <h3><i class="fas fa-pen"></i> Edit Dataset</h3>
        <div class="field"><label>Name</label><input id="edName" value="${esc(d.name)}"></div>
        <div class="field"><label>Description</label><input id="edDesc" value="${esc(d.description || '')}"></div>
        <div class="field"><label>Tags</label><input id="edTags" value="${esc(d.tags || '')}"></div>
        <div class="field"><label>Privacy</label>
          <select id="edPrivate">
            <option value="1" ${d.private == 1 ? 'selected' : ''}>Private</option>
            <option value="0" ${d.private == 0 ? 'selected' : ''}>Public</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline btn-sm" id="edCancel">Cancel</button>
          <button class="btn btn-primary btn-sm" id="edSave">Save</button>
        </div>
      </div>
    </div>
  `;

      await api(`/datasets/${d.id}/update/`, {
        method: 'PUT',

          name: $('#edName').value.trim(),
          description: $('#edDesc').value.trim(),
          tags: $('#edTags').value.trim(),
          private: $('#edPrivate').value === '1'

    <div class="page-title"><i class="fas fa-code"></i> Query Editor</div>
    <div class="page-sub">Write SQL and run it against any accessible dataset. JOINs supported.</div>

    <div class="panel" style="margin-bottom:1rem">

              <option value="${d.id}" ${state.editorDatasetId === d.id ? 'selected' : ''}>
                ${esc(d.name)} · ${fmtNum(d.row_count)} rows · by ${esc(d.uploaded_by)}
              </option>
            `).join('')}
          </select>
        </div>
        <div style="display:flex;gap:.35rem">
          <button class="btn btn-outline btn-sm" id="editorThemeBtn" title="Editor theme">
            <i class="fas fa-palette"></i> Theme: <span id="editorThemeLabel">${esc(state.editorTheme)}</span>
          </button>
          <button class="btn btn-outline btn-sm" id="editorCaseBtn" title="Case mode">
            <i class="fas fa-font"></i> Case: <span id="editorCaseLabel">${esc(state.editorCase)}</span>
          </button>
        </div>
      </div>
    </div>

    <div class="editor-wrap">
      <div class="editor-toolbar">
        <div class="group">
          <button class="btn btn-primary btn-sm" id="runBtn"><i class="fas fa-play"></i> Run</button>
          <button class="btn btn-outline btn-sm" id="fmtBtn" style="background:rgba(127,127,127,.15);color:var(--ed-fg);border-color:transparent"><i class="fas fa-align-left"></i> Format</button>
          <button class="btn btn-outline btn-sm" id="clearBtn" style="background:rgba(127,127,127,.15);color:var(--ed-fg);border-color:transparent"><i class="fas fa-eraser"></i> Clear</button>
          <button class="btn btn-outline btn-sm" id="copyBtn" style="background:rgba(127,127,127,.15);color:var(--ed-fg);border-color:transparent"><i class="fas fa-copy"></i> Copy</button>
        </div>
        <div class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run</div>
      </div>
      <div class="editor-body">
        <div class="ln" id="ln">1</div>
        <textarea id="sqlEditor" class="sql-editor" spellcheck="false" placeholder="SELECT * FROM your_dataset;"></textarea>
      </div>
    </div>

    <div class="panel" style="padding:0;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;
        border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap;gap:.5rem">
        <span style="font-weight:600;font-size:.9rem"><i class="fas fa-table"></i> Results</span>
        <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
          <span class="chip" id="rowCount">0 rows</span>
          <button class="btn btn-outline btn-sm" id="exportCsvBtn" disabled><i class="fas fa-file-csv"></i> CSV</button>
          <button class="btn btn-outline btn-sm" id="exportJsonBtn" disabled><i class="fas fa-file-code"></i> JSON</button>
          <button class="btn btn-outline btn-sm" id="exportSqlBtn" disabled><i class="fas fa-file-code"></i> SQL</button>
        </div>
      </div>
      <div class="tbl-wrap" style="border:0;border-radius:0">

          <div class="empty"><i class="fas fa-terminal"></i>Select a dataset and click <strong>Run</strong></div>

        <div id="editorPagination"></div>
      </div>
    </div>
  `;

  const editor = $('#sqlEditor');
  const ln = $('#ln');

  function paintLn() {
    const n = editor.value.split('\n').length;
    ln.innerHTML = Array.from({ length: n }, (_, i) => i + 1).join('<br>');
  }
  paintLn();
  editor.addEventListener('input', paintLn);
  editor.addEventListener('scroll', () => { ln.scrollTop = editor.scrollTop; });

  // ===== Autosave =====
  const autosave = debounce(async () => {
    if (!state.activeEditorSessionKey) return;
    await saveEditorSession(state.activeEditorSessionKey, {
      editor_sql: editor.value,
      theme: state.editorTheme,
      case_mode: state.editorCase,
    });
  }, AUTOSAVE_DEBOUNCE_MS);
  editor.addEventListener('input', autosave);

  // ===== Load: pending SQL > session SQL > dataset default =====
  if (state.pendingEditorSQL) {
    editor.value = state.pendingEditorSQL;
    state.pendingEditorSQL = null;
    paintLn();
  } else if (state.editorDatasetId) {
    const found = allAccessible.find(d => d.id === state.editorDatasetId);
    if (found) setTimeout(() => loadEditorDataset(state.editorDatasetId, editor), 100);
  }

  // ===== Dataset select =====
  $('#editorDsSelect').addEventListener('change', async e => {
    const id = parseInt(e.target.value);
    if (!id) {
      state.editorDatasetId = null;
      state.activeDataset = null;
      editor.value = ''; paintLn();
      return;
    }
    state.editorDatasetId = id;
    await loadEditorDataset(id, editor);
    paintLn();
  });

  // ===== Run =====
  $('#runBtn').addEventListener('click', () => runQuery(editor));
  editor.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runQuery(editor);
    }
  });

  // ===== Format =====
  $('#fmtBtn').addEventListener('click', () => {
    let s = editor.value;
    s = s.replace(/\s+/g, ' ')
         .replace(/\s*,\s*/g, ',\n  ')
         .replace(/\s+FROM\s+/gi, '\nFROM ')
         .replace(/\s+WHERE\s+/gi, '\nWHERE ')
         .replace(/\s+ORDER BY\s+/gi, '\nORDER BY ')
         .replace(/\s+GROUP BY\s+/gi, '\nGROUP BY ')
         .replace(/\s+JOIN\s+/gi, '\nJOIN ')
         .replace(/\s+LEFT\s+JOIN\s+/gi, '\nLEFT JOIN ')
         .replace(/\s+ON\s+/gi, '\n  ON ');
    editor.value = s;
    paintLn();
    autosave();
  });

  // ===== Clear =====
  $('#clearBtn').addEventListener('click', () => {
    editor.value = '';
    paintLn();
    autosave();
  });

  // ===== Copy =====
  $('#copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(editor.value);
    toast('Copied', 'success');
  });

  // ===== Theme toggle =====
  $('#editorThemeBtn').addEventListener('click', () => {
    const themes = ['vs-dark', 'vs-light', 'monokai', 'solarized', 'github'];
    const idx = themes.indexOf(state.editorTheme);
    state.editorTheme = themes[(idx + 1) % themes.length];
    localStorage.setItem('ebs_editor_theme', state.editorTheme);
    applyEditorPreferences();
    $('#editorThemeLabel').textContent = state.editorTheme;
    toast(`Editor theme: ${state.editorTheme}`, 'info');
    api('/auth/preferences/', {
      method: 'PUT',
      body: JSON.stringify({ editor_theme: state.editorTheme })
    }).catch(() => {});
    autosave();
  });

  // ===== Case toggle =====
  $('#editorCaseBtn').addEventListener('click', () => {
    const modes = ['upper', 'lower', 'asis'];
    const idx = modes.indexOf(state.editorCase);
    state.editorCase = modes[(idx + 1) % modes.length];
    localStorage.setItem('ebs_editor_case', state.editorCase);
    $('#editorCaseLabel').textContent = state.editorCase;
    applyCaseMode(editor);
    api('/auth/preferences/', {
      method: 'PUT',
      body: JSON.stringify({ editor_case: state.editorCase })
    }).catch(() => {});
    autosave();
  });

  // ===== Export =====
  $('#exportCsvBtn').addEventListener('click', () => {
    const rows = state.lastResult || [];
    if (!rows.length) return;
    const cols = Object.keys(rows[0]);
    const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => {
      let v = r[c] ?? '';
      if (typeof v === 'string' && /[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
      return v;
    }).join(','))).join('\n');
    download(`result_${Date.now()}.csv`, csv, 'text/csv');
  });
  $('#exportJsonBtn').addEventListener('click', () => {
    const rows = state.lastResult || [];
    if (!rows.length) return;
    download(`result_${Date.now()}.json`, JSON.stringify(rows, null, 2), 'application/json');
  });
  $('#exportSqlBtn').addEventListener('click', () => {
    const rows = state.lastResult || [];
    if (!rows.length) return;
    const cols = Object.keys(rows[0]);
    let sql = `CREATE TABLE exported_result (\n`;
    sql += cols.map(c => `  ${c} VARCHAR2(4000)`).join(',\n');
    sql += `\n);\n\n`;
    rows.forEach(r => {
      const vals = cols.map(c => {
        const v = r[c];
        if (v === null || v === undefined) return 'NULL';
        if (typeof v === 'number') return v;
        return `'${String(v).replace(/'/g, "''")}'`;
      }).join(', ');
      sql += `INSERT INTO exported_result (${cols.join(', ')}) VALUES (${vals});\n`;
    });
    download(`result_${Date.now()}.sql`, sql, 'text/sql');
  });
}

async function loadEditorDataset(id, editor) {
  try {
    const ds = await api(`/datasets/${id}/`);
    state.activeDataset = ds;
    const safeName = ds.name.replace(/\s+/g, '_').toUpperCase();
    editor.value = `SELECT * FROM ${safeName}`;
    const ln = $('#ln');
    if (ln) {
      const n = editor.value.split('\n').length;
      ln.innerHTML = Array.from({ length: n }, (_, i) => i + 1).join('<br>');
    }
    $('#rowCount').textContent = '0 rows';
    $('#gridWrap').innerHTML = `<div class="empty"><i class="fas fa-terminal"></i>Click <strong>Run</strong></div>`;
    $('#editorPagination').innerHTML = '';
    ['exportCsvBtn', 'exportJsonBtn', 'exportSqlBtn'].forEach(eid => {
      const el = $('#' + eid);
      if (el) el.disabled = true;
    });
  } catch (err) { toast(err.message, 'error'); }
}

async function runQuery(editor) {
  const sql = editor.value.trim();
  if (!state.editorDatasetId) return toast('Select a dataset first', 'warn');
  if (!sql) return toast('Write a query first', 'warn');

  const runBtn = $('#runBtn');
  runBtn.disabled = true;
  runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running…';

  try {
    const result = await api('/query/', {
      method: 'POST',
      body: JSON.stringify({ sql, dataset_id: state.editorDatasetId })
    });
    state.lastResult = result.rows;
    state.editorPagination.allRows = result.rows;
    state.editorPagination.page = 1;
    state.editorPagination.total = result.rows.length;
    paintGrid(result.rows);
    ['exportCsvBtn', 'exportJsonBtn', 'exportSqlBtn'].forEach(eid => {
      const el = $('#' + eid);
      if (el) el.disabled = !result.rows.length;
    });
    toast(`Executed · ${fmtNum(result.row_count)} row(s)`, 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    runBtn.disabled = false;
    runBtn.innerHTML = '<i class="fas fa-play"></i> Run';
  }
}

function paintGrid(rows) {
  const el = $('#gridWrap');
  $('#rowCount').textContent = `${fmtNum(rows.length)} rows`;

  if (!rows.length) {
    el.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>No rows returned.</div>';
    $('#editorPagination').innerHTML = '';
    return;
  }

  const PER_PAGE = 50;
  let currentPage = 1;

  function renderPage() {
    const start = (currentPage - 1) * PER_PAGE;
    const end = start + PER_PAGE;
    const pageRows = rows.slice(start, end);
    const cols = Object.keys(rows[0]);

    let html = '<table><thead><tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
    pageRows.forEach(r => {
      html += '<tr>' + cols.map(c => {
        let v = r[c];
        if (v === null || v === undefined) v = '<span style="color:var(--text-3)">NULL</span>';
        else if (typeof v === 'object') v = esc(JSON.stringify(v));
        else v = esc(String(v));
        return `<td>${v}</td>`;
      }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;

    renderPagination('editorPagination', rows.length, currentPage, PER_PAGE, (p) => {
      currentPage = p;
      renderPage();
      $('.tbl-scroll')?.scrollTo(0, 0);
    });
  }
  renderPage();
}
